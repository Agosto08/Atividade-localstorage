<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício 1 - Tema Claro / Escuro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    body.claro {
      background-color: #f4f4f9;
      color: #333333;
    }
    body.escuro {
      background-color: #1e1e2e;
      color: #ffffff;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-claro { background-color: #e0e0e0; color: #333; }
    .btn-escuro { background-color: #444466; color: #fff; }
  </style>
</head>
<body class="claro">
  <h2>Escolha o Tema</h2>
  <div class="btn-container">
    <button class="btn-claro" id="btnClaro">Tema Claro</button>
    <button class="btn-escuro" id="btnEscuro">Tema Escuro</button>
  </div>

  <script>
    const btnClaro = document.getElementById("btnClaro");
    const btnEscuro = document.getElementById("btnEscuro");

    const temaSalvo = localStorage.getItem("app.tema");
    if (temaSalvo) {
      document.body.className = temaSalvo;
    }

    btnClaro.addEventListener("click", function() {
      document.body.className = "claro";
      localStorage.setItem("app.tema", "claro");
    });

    btnEscuro.addEventListener("click", function() {
      document.body.className = "escuro";
      localStorage.setItem("app.tema", "escuro");
    });
  </script>
</body>
</html>
